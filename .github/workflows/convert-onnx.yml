name: Convert Spleeter to ONNX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.5.0
          pip install tf2onnx==1.9.3
          pip install spleeter==2.1.0
          pip install numpy==1.19.5 --force-reinstall --no-deps

      - name: Download official pretrained model
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p pretrained_models/2stems
          curl -L -o /tmp/2stems.tar.gz https://github.com/deezer/spleeter/releases/download/v1.4.0/2stems.tar.gz
          tar -xzf /tmp/2stems.tar.gz -C pretrained_models/2stems
          echo "MODEL_DOWNLOADED_OK"
          find pretrained_models -type f

      - name: Inspect checkpoint graph
        run: |
          find pretrained_models/2stems -type f
          echo "---"
          pip install tensorflow==2.3.0 --quiet
          python3 << 'EOF'
          import tensorflow.compat.v1 as tf
          tf.disable_v2_behavior()

          meta_path = "pretrained_models/2stems/model.meta"
          saver = tf.train.import_meta_graph(meta_path)
          graph = tf.get_default_graph()
          ops = graph.get_operations()
          print(f"Total ops: {len(ops)}")

          print("--- Input ops ---")
          for op in ops:
              if op.type == "Placeholder":
                  print(op.name, op.type, op.outputs[0].shape)

          consumed = set()
          for op in ops:
              for inp in op.inputs:
                  consumed.add(inp.name)

          print("--- Sink tensors (outputs not consumed by anything else = real graph outputs) ---")
          for op in ops:
              if op.name.startswith("save"):
                  continue
              for out in op.outputs:
                  if out.name not in consumed:
                      print(out.name, out.shape)
          EOF

      - name: Convert to ONNX
        run: |
          pip install tensorflow==2.8.0 --quiet
          pip install "numpy==1.21.6" --quiet
          pip install "h5py==3.1.0" --quiet
          pip install tf2onnx==1.13.0 --quiet
          pip install "onnx==1.12.0" --quiet
          pip install "numpy==1.21.6" --force-reinstall --no-deps --quiet
          python3 << 'EOF'
          import sys
          import numpy as np

          _orig_pad = np.pad
          def _safe_pad(array, pad_width, mode="constant", **kwargs):
              try:
                  return _orig_pad(array, pad_width, mode, **kwargs)
              except ValueError as e:
                  if "negative" not in str(e):
                      raise
                  arr = np.asarray(array)
                  before, after = pad_width
                  target_len = max(0, arr.shape[0] + after)
                  return arr[:target_len]
          np.pad = _safe_pad

          sys.argv = [
              "tf2onnx.convert",
              "--checkpoint", "pretrained_models/2stems/model.meta",
              "--output", "/tmp/2stems_spleeter_unet.onnx",
              "--inputs", "strided_slice_3:0",
              "--outputs", "vocals_spectrogram/mul:0,accompaniment_spectrogram/mul:0",
              "--opset", "12",
          ]
          from tf2onnx.convert import main
          main()
          EOF
          ls -lh /tmp/2stems_spleeter_unet.onnx

      - name: Upload ONNX model
        uses: actions/upload-artifact@v4
        with:
          name: spleeter-2stems-onnx
          path: /tmp/2stems_spleeter_unet.onnx

      - name: Upload ONNX model
        uses: actions/upload-artifact@v4
        with:
          name: spleeter-2stems-onnx
          path: /tmp/2stems_spleeter.onnx

      - name: Locate downloaded model files
        run: |
          find / -iname "*2stems*" -not -path "*/proc/*" 2>/dev/null | tee model_paths.txt
          echo "---checkpoint files---" | tee -a model_paths.txt
          find / -iname "*.index" -o -iname "*.data-*" -o -iname "checkpoint" 2>/dev/null | grep -v proc | tee -a model_paths.txt

      - name: Upload debug info
        uses: actions/upload-artifact@v4
        with:
          name: debug-model-paths
          path: model_paths.txt
