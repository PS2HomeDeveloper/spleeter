name: Convert Spleeter to ONNX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.5.0
          pip install tf2onnx==1.9.3
          pip install spleeter==2.1.0
          pip install numpy==1.19.5 --force-reinstall --no-deps

      - name: Download official pretrained model
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install soundfile numpy==1.19.5 --no-deps
          python -c "
          import numpy as np
          import soundfile as sf
          sf.write('/tmp/silence.wav', np.zeros(44100*2), 44100)
          from spleeter.separator import Separator
          sep = Separator('spleeter:2stems')
          sep.separate_to_file('/tmp/silence.wav', '/tmp/out')
          print('MODEL_DOWNLOADED_OK')
          "

      - name: Locate downloaded model files
        run: |
          find / -iname "*2stems*" -not -path "*/proc/*" 2>/dev/null | tee model_paths.txt
          echo "---checkpoint files---" | tee -a model_paths.txt
          find / -iname "*.index" -o -iname "*.data-*" -o -iname "checkpoint" 2>/dev/null | grep -v proc | tee -a model_paths.txt

      - name: Upload debug info
        uses: actions/upload-artifact@v4
        with:
          name: debug-model-paths
          path: model_paths.txt
